<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Virtual Art Gallery - Olympus</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(0, 0, 0, 0.4);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    /* Top Left Desktop Navigation Overlay */
    #nav-instructions {
      position: absolute;
      top: 25px;
      left: 25px;
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 14px 18px;
      color: #f5f4ef;
      z-index: 20;
      font-size: 0.82rem;
      line-height: 1.6;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: opacity 0.3s ease, visibility 0.3s ease;
      pointer-events: none;
    }

    #nav-instructions.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #nav-instructions h4 {
      margin: 0 0 8px 0;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #f5f4ef;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 4px;
    }

    #nav-instructions ul {
      margin: 0;
      padding-left: 16px;
      color: #aaa;
    }

    #nav-instructions li span {
      color: #fff;
      font-weight: 600;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 12, 0.95);
      color: #f5f4ef;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
      text-align: center;
      padding: 20px;
    }

    #overlay h1 {
      margin: 0 0 10px 0;
      letter-spacing: 3px;
      font-weight: 300;
      text-transform: uppercase;
      font-size: 1.8rem;
    }

    #overlay p {
      margin: 0 0 30px 0;
      color: #a09a8e;
      font-size: 0.95rem;
    }

    .btn-container {
      display: flex;
      gap: 20px;
    }

    .device-btn {
      background: transparent;
      border: 2px solid #555;
      color: #f5f4ef;
      padding: 14px 28px;
      font-size: 1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .device-btn:hover {
      background: #f5f4ef;
      color: #111;
      border-color: #f5f4ef;
    }

    /* Minimalist Clean Inspect Modal */
    #inspect-modal {
      position: absolute;
      inset: 0;
      background: rgba(12, 12, 15, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 40;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #inspect-modal.visible {
      opacity: 1;
      visibility: visible;
    }

    .inspect-container {
      width: min(85vw, 750px);
      display: flex;
      flex-direction: column;
      gap: 15px;
      color: #f5f4ef;
    }

    .inspect-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 10px;
    }

    .artist-switcher {
      display: flex;
      gap: 15px;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .artist-tab {
      background: none;
      border: none;
      color: #777;
      cursor: pointer;
      padding: 0;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .artist-tab.active {
      color: #f5f4ef;
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    .inspect-title {
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aaa;
      margin: 0;
    }

    .inspect-frame {
      width: 100%;
      height: 420px;
      background: #1a1a1f;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .inspect-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .audio-player-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(25, 25, 30, 0.8);
      padding: 14px 20px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .play-pause-btn {
      background: none;
      border: none;
      color: #f5f4ef;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .audio-track-line {
      flex-grow: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .audio-track-progress {
      position: absolute;
      top: 0;
      left: 0;
      width: 0%;
      height: 100%;
      background: #f5f4ef;
    }

    .audio-time {
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #aaa;
      min-width: 45px;
      text-align: right;
    }

    .close-inspect {
      position: absolute;
      top: 30px;
      right: 40px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .close-inspect:hover { color: #fff; }

    #audio-player-ui {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(20, 20, 24, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f5f4ef;
      padding: 12px 24px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 20;
      pointer-events: none;
    }

    #audio-player-ui.visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .audio-icon {
      width: 10px;
      height: 10px;
      background: #f5f4ef;
      border-radius: 50%;
    }

    .audio-info h4 {
      margin: 0;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .audio-info p {
      margin: 2px 0 0 0;
      font-size: 0.9rem;
      font-weight: 300;
      color: #aaa;
    }

    #prompt-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #f5f4ef;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.9rem;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      cursor: pointer;
    }
    #prompt-hint.visible { opacity: 1; }

    #joystick-zone {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: none;
      z-index: 20;
    }

    #joystick-knob {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 40px;
      height: 40px;
      background: rgba(200, 190, 175, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
  <script src="https://unpkg.com/three@0.136.0/build/three.min.js"></script>
</head>
<body>
  <div id="crosshair"></div>

  <!-- Top-Left Navigation Instructions HUD -->
  <div id="nav-instructions">
    <h4>Controls</h4>
    <ul>
      <li><span>W, A, S, D</span> / <span>Arrows</span> : Move</li>
      <li><span>Mouse</span> : Look around</li>
      <li><span>I</span> : Inspect Artwork</li>
      <li><span>ESC</span> : Release Mouse / Exit</li>
    </ul>
  </div>

  <div id="prompt-hint">
    <span id="hint-text">Press [ I ] to Inspect Artwork</span>
    <button id="inspect-action-btn" style="background:#f5f4ef; border:none; color:#111; padding:6px 12px; border-radius:4px; font-weight:600; cursor:pointer; display:none;">Inspect</button>
  </div>

  <div id="audio-player-ui">
    <div class="audio-icon"></div>
    <div class="audio-info">
      <h4 id="audio-artist">Audio Guide</h4>
      <p id="audio-title">Listening to exhibition track...</p>
    </div>
  </div>

  <!-- Inspect Modal -->
  <div id="inspect-modal">
    <button class="close-inspect" id="modal-close-btn">✕ Close</button>
    <div class="inspect-container">
      <div class="inspect-header">
        <div class="artist-switcher">
          <button class="artist-tab active" data-artist="Nonso">Nonso</button>
          <button class="artist-tab" data-artist="Sonder">Sonder</button>
          <button class="artist-tab" data-artist="Aka">Aka</button>
        </div>
        <p class="inspect-title" id="inspect-title">PAINTING 1</p>
      </div>

      <div class="inspect-frame">
        <img id="inspect-img" src="" alt="Artwork View">
      </div>

      <div class="audio-player-bar">
        <button class="play-pause-btn" id="modal-audio-btn">▶</button>
        <div class="audio-track-line" id="track-line">
          <div class="audio-track-progress" id="track-progress"></div>
        </div>
        <div class="audio-time" id="audio-time">0:30</div>
      </div>
    </div>
  </div>

  <div id="overlay">
    <h1>Virtual Art Gallery</h1>
    <p>Please select your device to enter the exhibition</p>
    <div class="btn-container">
      <button class="device-btn" id="btn-desktop">Desktop</button>
      <button class="device-btn" id="btn-mobile">Mobile / Tablet</button>
    </div>
  </div>

  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>

  <script>
    var active = false;
    var isMobileMode = false;
    var isInspecting = false;
    var currentLookAtTarget = null;

    var overlay = document.getElementById('overlay');
    var navInstructions = document.getElementById('nav-instructions');
    var joystickZone = document.getElementById('joystick-zone');
    var joystickKnob = document.getElementById('joystick-knob');
    var audioUi = document.getElementById('audio-player-ui');
    var promptHint = document.getElementById('prompt-hint');
    var hintText = document.getElementById('hint-text');
    var inspectActionBtn = document.getElementById('inspect-action-btn');
    var inspectModal = document.getElementById('inspect-modal');
    
    var audioArtistText = document.getElementById('audio-artist');
    var audioTitleText = document.getElementById('audio-title');
    var inspectTitle = document.getElementById('inspect-title');
    var inspectImg = document.getElementById('inspect-img');
    var modalAudioBtn = document.getElementById('modal-audio-btn');
    var modalCloseBtn = document.getElementById('modal-close-btn');
    var trackProgress = document.getElementById('track-progress');
    var audioTimeDisplay = document.getElementById('audio-time');
    var artistTabs = document.querySelectorAll('.artist-tab');

    // Artist Switcher Logic
    var activeArtist = 'Nonso';
    artistTabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        artistTabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        activeArtist = tab.getAttribute('data-artist');
        if (currentLookAtTarget) {
          currentLookAtTarget.artist = activeArtist;
          audioArtistText.textContent = activeArtist;
        }
      });
    });

    document.getElementById('btn-desktop').addEventListener('click', function() {
      isMobileMode = false;
      inspectActionBtn.style.display = 'none';
      hintText.textContent = 'Press [ I ] to Inspect Artwork';
      navInstructions.style.display = 'block';
      document.body.requestPointerLock();
      startExperience();
    });

    document.getElementById('btn-mobile').addEventListener('click', function() {
      isMobileMode = true;
      inspectActionBtn.style.display = 'inline-block';
      hintText.textContent = 'Artwork in view';
      navInstructions.style.display = 'none';
      joystickZone.style.display = 'block';
      startExperience();
    });

    function startExperience() {
      overlay.style.display = 'none';
      active = true;
    }

    document.addEventListener('pointerlockchange', function() {
      if (document.pointerLockElement !== document.body && !isMobileMode && active && !isInspecting) {
        overlay.style.display = 'flex';
        active = false;
      }
    });

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111114);

    var camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.rotation.order = 'YXZ';
    
    // Spawn camera on the West side near door, facing East directly toward the East Wall feature display
    camera.position.set(-10, 1.6, 0);

    var renderer = new THREE.WebGLRenderer({ antialias: true, failIfMajorPerformanceCaveat: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    document.body.appendChild(renderer.domElement);

    // Original clean neutral gallery ambient lighting
    var hemiLight = new THREE.HemisphereLight(0xe8e4dc, 0x222226, 0.4);
    scene.add(hemiLight);

    // Precise Spotlighting Function with Warm Tones (Hex 0xffd8a6) over the paintings
    function addIndividualPaintingSpotlight(x, y, z, rotY, frameHeight) {
      var h = frameHeight || 2.0;
      var offset = 0.35;
      var lightX = x;
      var lightZ = z;

      if (Math.abs(rotY - 0) < 0.1) { lightZ += offset; }
      else if (Math.abs(rotY - Math.PI) < 0.1) { lightZ -= offset; }
      else if (Math.abs(rotY - (-Math.PI / 2)) < 0.1) { lightX -= offset; }
      else if (Math.abs(rotY - (Math.PI / 2)) < 0.1) { lightX += offset; }

      var lightPosY = y + (h / 2) + 0.3;
      var light = new THREE.SpotLight(0xffd8a6, 1.1, 7, Math.PI / 6, 0.8, 1.5);
      light.position.set(lightX, lightPosY, lightZ);

      var targetObj = new THREE.Object3D();
      targetObj.position.set(x, y, z);
      scene.add(targetObj);
      light.target = targetObj;
      scene.add(light);
    }

    var floorCanvas = document.createElement('canvas');
    floorCanvas.width = 256; floorCanvas.height = 256;
    var fctx = floorCanvas.getContext('2d');
    fctx.fillStyle = '#eae8e2'; fctx.fillRect(0, 0, 256, 256);
    fctx.fillStyle = '#161619';
    fctx.fillRect(0, 0, 128, 128);
    fctx.fillRect(128, 128, 128, 128);

    var floorTexture = new THREE.CanvasTexture(floorCanvas);
    floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(8, 4);

    var floor = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 16),
      new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.4, metalness: 0.05 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    function generateMarbleTexture() {
      var canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 1024;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ebe9e1';
      ctx.fillRect(0, 0, 1024, 1024);

      for (var i = 0; i < 28; i++) {
        var grad = ctx.createRadialGradient(
          Math.random() * 1024, Math.random() * 1024, 10,
          Math.random() * 1024, Math.random() * 1024, 280
        );
        grad.addColorStop(0, 'rgba(200, 195, 185, 0.25)');
        grad.addColorStop(1, 'rgba(235, 233, 225, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 1024);
      }

      function drawVein(startX, startY, length, strokeColor, lineWidth) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        var x = startX, y = startY;
        for (var j = 0; j < length; j++) {
          x += (Math.random() - 0.5) * 16 + 2;
          y += (Math.random() - 0.45) * 14;
          ctx.lineTo(x, y);
          if (Math.random() < 0.04 && lineWidth > 1) {
            drawVein(x, y, length / 2, strokeColor, lineWidth * 0.6);
          }
        }
        ctx.stroke();
      }

      for (var i = 0; i < 18; i++) drawVein(Math.random() * 1024, Math.random() * 1024, 90, 'rgba(105, 110, 115, 0.35)', 3.2);
      for (var i = 0; i < 10; i++) drawVein(Math.random() * 1024, Math.random() * 1024, 60, 'rgba(150, 140, 125, 0.22)', 1.8);

      var texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    var wallHeight = 11.25;
    var marbleTex = generateMarbleTexture();
    var longWallTex = marbleTex.clone(); longWallTex.repeat.set(6, 3);
    var shortWallTex = marbleTex.clone(); shortWallTex.repeat.set(4, 3);

    var marbleMatLong = new THREE.MeshStandardMaterial({ map: longWallTex, roughness: 0.35, metalness: 0.02 });
    var marbleMatShort = new THREE.MeshStandardMaterial({ map: shortWallTex, roughness: 0.35, metalness: 0.02 });

    // NORTH WALL
    var northMesh = new THREE.Mesh(new THREE.PlaneGeometry(24, wallHeight), marbleMatLong);
    northMesh.position.set(0, wallHeight/2, -8);
    scene.add(northMesh);

    // SOUTH WALL
    var southMesh = new THREE.Mesh(new THREE.PlaneGeometry(24, wallHeight), marbleMatLong);
    southMesh.position.set(0, wallHeight/2, 8);
    southMesh.rotation.y = Math.PI;
    scene.add(southMesh);
    
    // EAST WALL
    var eastWall = new THREE.Mesh(new THREE.PlaneGeometry(16, wallHeight), marbleMatShort);
    eastWall.position.set(12, wallHeight / 2, 0);
    eastWall.rotation.y = -Math.PI / 2;
    scene.add(eastWall);

    // WEST WALL (Entrance Door Wall)
    var westWall = new THREE.Mesh(new THREE.PlaneGeometry(16, wallHeight), marbleMatShort);
    westWall.position.set(-12, wallHeight / 2, 0);
    westWall.rotation.y = Math.PI / 2;
    scene.add(westWall);

    var ceiling = new THREE.Mesh(new THREE.PlaneGeometry(24, 16), new THREE.MeshStandardMaterial({ color: 0xd9d6ce, roughness: 0.85 }));
    ceiling.position.set(0, wallHeight, 0);
    ceiling.rotation.x = Math.PI / 2;
    scene.add(ceiling);

    function buildColumns() {
      var colMat = new THREE.MeshStandardMaterial({ map: marbleTex, roughness: 0.3, metalness: 0.05 });
      var colGeom = new THREE.CylinderGeometry(0.5, 0.6, wallHeight, 16);
      
      var xPositions = [-6, 0, 6];
      var zPositions = [-3.5, 3.5];

      for (var i = 0; i < xPositions.length; i++) {
        for (var j = 0; j < zPositions.length; j++) {
          var column = new THREE.Mesh(colGeom, colMat);
          column.position.set(xPositions[i], wallHeight / 2, zPositions[j]);
          scene.add(column);
        }
      }
    }
    buildColumns();

    function buildEntranceDoor() {
      var doorGroup = new THREE.Group();
      var woodCanvas = document.createElement('canvas');
      woodCanvas.width = 512; woodCanvas.height = 1024;
      var wctx = woodCanvas.getContext('2d');
      wctx.fillStyle = '#3a2416'; wctx.fillRect(0, 0, 512, 1024);
      for (var i = 0; i < 400; i++) {
        wctx.fillStyle = Math.random() > 0.5 ? 'rgba(42, 25, 14, 0.4)' : 'rgba(75, 48, 30, 0.3)';
        wctx.fillRect(Math.random() * 512, 0, Math.random() * 4 + 1, 1024);
      }
      var woodTexture = new THREE.CanvasTexture(woodCanvas);
      var woodMat = new THREE.MeshStandardMaterial({ map: woodTexture, roughness: 0.65 });
      var frameMat = new THREE.MeshStandardMaterial({ color: 0x1f140c, roughness: 0.7 });
      var handleMat = new THREE.MeshStandardMaterial({ color: 0x8b6528, roughness: 0.35, metalness: 0.8 });

      doorGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.12, 4.85, 2.65), frameMat));
      var leftDoor = new THREE.Mesh(new THREE.BoxGeometry(0.08, 4.75, 1.25), woodMat); leftDoor.position.set(0.02, 0, -0.63);
      var rightDoor = new THREE.Mesh(new THREE.BoxGeometry(0.08, 4.75, 1.25), woodMat); rightDoor.position.set(0.02, 0, 0.63);
      doorGroup.add(leftDoor, rightDoor);

      var hGeom = new THREE.CylinderGeometry(0.02, 0.02, 0.45);
      var leftHandle = new THREE.Mesh(hGeom, handleMat); leftHandle.position.set(0.09, -0.1, -0.12);
      var rightHandle = new THREE.Mesh(hGeom, handleMat); rightHandle.position.set(0.09, -0.1, 0.12);
      doorGroup.add(leftHandle, rightHandle);

      doorGroup.position.set(-11.92, 2.42, 0);
      scene.add(doorGroup);

      addIndividualPaintingSpotlight(-11.92, 2.42, 0, Math.PI / 2, 4.85);
    }
    buildEntranceDoor();

    var raycaster = new THREE.Raycaster();
    var interactables = [];
    var currentAudio = null;
    var currentTargetId = null;
    var textureLoader = new THREE.TextureLoader();

    function createArtwork(id, x, y, z, rotY, w, h, pieceTitle, description, imageSrc, audioSrc) {
      var group = new THREE.Group();
      
      var canvasMat = new THREE.MeshStandardMaterial({ color: 0x2b2d30, roughness: 0.8 });
      if (imageSrc) {
        textureLoader.load(imageSrc, function(tex) {
          canvasMat.map = tex;
          canvasMat.color.set(0xffffff);
          canvasMat.needsUpdate = true;
        });
      }

      var canvasMesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), canvasMat);
      group.add(canvasMesh);

      group.position.set(x, y, z);
      group.rotation.y = rotY;

      canvasMesh.userData = {
        id: id,
        artist: activeArtist,
        title: pieceTitle,
        desc: description,
        imgSrc: imageSrc || '',
        audio: new Audio(audioSrc)
      };
      scene.add(group);
      interactables.push(canvasMesh);

      addIndividualPaintingSpotlight(x, y, z, rotY, h);
    }

    // --- EAST WALL: EVENLY SPACED GALLERY LAYOUT (X = 11.95, RotY = -Math.PI / 2) ---
    // Central Main Portrait
    createArtwork('painting_1', 11.95, 4.3, 0.0, -Math.PI / 2, 3.8, 6.2, 'SELF-HATRED', 'An intense psychological exploration of internal conflict.', './SELF-HATRED.jpg', './assets/audio/artist1_piece1.mp3');

    // Flank 1 (Left side, 3 evenly spaced canvases: Top, Middle, Bottom)
    createArtwork('east_tl', 11.95, 6.3, -3.4, -Math.PI / 2, 2.0, 1.8, 'PAINTING 2', 'Upper left canvas study.', null, './assets/audio/artist1_piece1.mp3');
    createArtwork('east_ml', 11.95, 4.3, -3.4, -Math.PI / 2, 2.0, 1.8, 'PAINTING 3', 'Middle left canvas study.', null, './assets/audio/artist1_piece1.mp3');
    createArtwork('east_bl', 11.95, 2.3, -3.4, -Math.PI / 2, 2.0, 1.8, 'PAINTING 4', 'Lower left canvas study.', null, './assets/audio/artist1_piece1.mp3');

    // Flank 2 (Right side, 2 evenly spaced canvases: Top, Bottom)
    createArtwork('east_tr', 11.95, 5.4, 3.4, -Math.PI / 2, 2.2, 2.0, 'PAINTING 5', 'Upper right canvas study.', null, './assets/audio/artist1_piece1.mp3');
    createArtwork('east_br', 11.95, 3.2, 3.4, -Math.PI / 2, 2.2, 2.0, 'PAINTING 6', 'Lower right canvas study.', null, './assets/audio/artist1_piece1.mp3');

    // --- NORTH WALL ---
    createArtwork('north_1', 0.0, 2.8, -7.95, 0, 2.8, 3.5, 'PAINTING 7', 'A monumental study.', null, './assets/audio/artist3_piece1.mp3');
    createArtwork('north_2', -7.0, 2.8, -7.95, 0, 2.2, 2.0, 'PAINTING 8', 'Exploring tactile surfaces.', null, './assets/audio/artist3_piece2.mp3');
    createArtwork('north_3', 7.0, 2.8, -7.95, 0, 2.2, 2.0, 'PAINTING 9', 'Reflecting ancient traditions.', null, './assets/audio/artist3_piece1.mp3');

    // --- SOUTH WALL ---
    createArtwork('south_1', -7.0, 2.2, 7.95, Math.PI, 2.4, 1.8, 'PAINTING 10', 'Expressive portraiture.', null, './assets/audio/artist2_piece1.mp3');
    createArtwork('south_2', 0.0, 2.8, 7.95, Math.PI, 2.6, 2.2, 'PAINTING 11', 'Dramatic lighting.', null, './assets/audio/artist2_piece2.mp3');
    createArtwork('south_3', 6.5, 2.5, 7.95, Math.PI, 2.6, 1.7, 'PAINTING 12', 'Ornamental balance.', null, './assets/audio/artist2_piece3.mp3');

    // Set initial camera rotation facing directly toward East Wall (RotY = -Math.PI / 2)
    var eulerY = -Math.PI / 2;
    var eulerX = 0;
    var moveInput = { forward: 0, right: 0 };
    var keys = {};

    window.addEventListener('keydown', function(e) {
      if (e.code === 'KeyI' && currentLookAtTarget && active) {
        toggleInspectMode();
      }
      keys[e.code] = true;
    });
    window.addEventListener('keyup', function(e) { keys[e.code] = false; });

    window.addEventListener('mousemove', function(e) {
      if (!active || isMobileMode || isInspecting) return;
      if (document.pointerLockElement === document.body) {
        eulerY -= e.movementX * 0.002;
        eulerX -= e.movementY * 0.002;
        eulerX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, eulerX));
      }
    });

    function toggleInspectMode() {
      if (!currentLookAtTarget) return;
      isInspecting = !isInspecting;
      if (isInspecting) {
        if (!isMobileMode) document.exitPointerLock();
        inspectTitle.textContent = currentLookAtTarget.title;
        inspectImg.src = currentLookAtTarget.imgSrc || '';
        inspectModal.classList.add('visible');
        navInstructions.classList.add('hidden');
      } else {
        inspectModal.classList.remove('visible');
        if (!isMobileMode) {
          navInstructions.classList.remove('hidden');
          document.body.requestPointerLock();
        }
      }
    }

    inspectActionBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (currentLookAtTarget) toggleInspectMode();
    });

    modalCloseBtn.addEventListener('click', function() {
      if (isInspecting) toggleInspectMode();
    });

    modalAudioBtn.addEventListener('click', function() {
      if (currentLookAtTarget && currentLookAtTarget.audio) {
        if (currentLookAtTarget.audio.paused) {
          currentLookAtTarget.audio.play().catch(function(){});
          modalAudioBtn.textContent = '❚❚';
        } else {
          currentLookAtTarget.audio.pause();
          modalAudioBtn.textContent = '▶';
        }
      }
    });

    var touchMoveId = null, touchLookId = null;
    var lookStartX = 0, lookStartY = 0;

    window.addEventListener('touchstart', function(e) {
      if (!active || !isMobileMode || isInspecting) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.clientX < window.innerWidth / 2 && touchMoveId === null) {
          touchMoveId = t.identifier;
          handleJoystick(t);
        } else if (t.clientX >= window.innerWidth / 2 && touchLookId === null) {
          touchLookId = t.identifier;
          lookStartX = t.clientX; lookStartY = t.clientY;
        }
      }
    });

    window.addEventListener('touchmove', function(e) {
      if (!active || !isMobileMode || isInspecting) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier === touchMoveId) {
          handleJoystick(t);
        } else if (t.identifier === touchLookId) {
          var dx = t.clientX - lookStartX;
          var dy = t.clientY - lookStartY;
          eulerY -= dx * 0.004;
          eulerX -= dy * 0.004;
          eulerX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, eulerX));
          lookStartX = t.clientX; lookStartY = t.clientY;
        }
      }
    });

    var resetTouch = function(t) {
      if (t.identifier === touchMoveId) {
        touchMoveId = null; moveInput.forward = 0; moveInput.right = 0;
        joystickKnob.style.transform = 'translate(0px, 0px)';
      } else if (t.identifier === touchLookId) {
        touchLookId = null;
      }
    };
    window.addEventListener('touchend', function(e) { for (var i = 0; i < e.changedTouches.length; i++) resetTouch(e.changedTouches[i]); });
    window.addEventListener('touchcancel', function(e) { for (var i = 0; i < e.changedTouches.length; i++) resetTouch(e.changedTouches[i]); });

    function handleJoystick(touch) {
      var rect = joystickZone.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      var dx = touch.clientX - cx, dy = touch.clientY - cy;
      var dist = Math.hypot(dx, dy), maxRadius = 38;
      if (dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
      joystickKnob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
      moveInput.right = dx / maxRadius;
      moveInput.forward = -dy / maxRadius;
    }

    var clock = new THREE.Clock();
    var forwardVec = new THREE.Vector3();
    var rightVec = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      var delta = Math.min(clock.getDelta(), 0.1);

      if (active && !isInspecting) {
        camera.rotation.y = eulerY;
        camera.rotation.x = eulerX;

        var f = moveInput.forward;
        var r = moveInput.right;
        if (!isMobileMode) {
          f = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0);
          r = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
        }

        camera.getWorldDirection(forwardVec);
        forwardVec.y = 0; forwardVec.normalize();
        rightVec.crossVectors(camera.up, forwardVec).negate();

        var speed = 3.8 * delta;
        camera.position.addScaledVector(forwardVec, f * speed);
        camera.position.addScaledVector(rightVec, r * speed);

        camera.position.x = Math.max(-11.3, Math.min(11.3, camera.position.x));
        camera.position.z = Math.max(-7.3, Math.min(7.3, camera.position.z));

        raycaster.setFromCamera({ x: 0, y: 0 }, camera);
        var hits = raycaster.intersectObjects(interactables);

        if (hits.length > 0 && hits[0].distance < 7.0) {
          var hit = hits[0].object;
          currentLookAtTarget = hit.userData;
          promptHint.classList.add('visible');

          if (currentTargetId !== hit.userData.id) {
            if (currentAudio) currentAudio.pause();
            currentTargetId = hit.userData.id;
            currentAudio = hit.userData.audio;
            currentAudio.play().catch(function() {});

            audioArtistText.textContent = hit.userData.artist;
            audioTitleText.textContent = hit.userData.title;
            audioUi.classList.add('visible');
          }
        } else {
          currentLookAtTarget = null;
          promptHint.classList.remove('visible');
          if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
            currentTargetId = null;
            audioUi.classList.remove('visible');
          }
        }

        if (currentAudio && !currentAudio.paused && currentAudio.duration) {
          var pct = (currentAudio.currentTime / currentAudio.duration) * 100;
          trackProgress.style.width = pct + '%';
          var mins = Math.floor(currentAudio.currentTime / 60);
          var secs = Math.floor(currentAudio.currentTime % 60);
          audioTimeDisplay.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
